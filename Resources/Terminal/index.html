<!doctype html>
<!-- Gita's built-in terminal: xterm.js (xterm/, MIT) in a page the app loads from its bundle. terminal.js talks to
     the app; the app runs the shell. Nothing here reaches the network. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="xterm/xterm.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--background, transparent); }
  #terminal { position: absolute; inset: 8px 4px 6px 12px; }
  .xterm-viewport { overflow-y: auto; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script src="terminal.js"></script>
</body>
</html>
