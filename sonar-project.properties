# SonarQube analysis for Gita. Run with scripts/sonar.sh, which reads the server URL, project key and token from
# the untracked .sonar.txt and produces the reports below first. Never commit credentials.
sonar.projectName=Gita
sonar.sourceEncoding=UTF-8

sonar.sources=Sources,scripts,Tools/QualityMetrics/Sources,Package.swift,Tools/QualityMetrics/Package.swift,Config
sonar.tests=Tests,Tools/QualityMetrics/Tests
sonar.exclusions=**/.build/**,build/**

# SonarQube Community Build has no Swift analyzer. Swift files are indexed through the HTML analyzer (it tolerates any
# text, counts lines and feeds duplication detection); the project uses an empty HTML quality profile, so no HTML rule
# runs on Swift. The Swift findings come from the local gate as external issues:
#   quality-metrics: cyclomatic, cognitive, Halstead, file size and CRAP (Tools/QualityMetrics)
#   swiftlint, periphery (dead code) and jscpd (duplication), converted by scripts/sonar-reports.py
sonar.html.file.suffixes=.swift
sonar.externalIssuesReportPaths=build/quality/sonar-issues.json,build/quality/sonar-external.json
sonar.coverageReportPaths=build/quality/sonar-coverage.xml

# Entry points are a single call each and are not loaded by the tests.
sonar.coverage.exclusions=Sources/GitaApp/main.swift,Sources/GitaAgentHelper/main.swift,scripts/**,Package.swift,\
  Tools/QualityMetrics/**,Config/**
sonar.cpd.exclusions=Tests/**
